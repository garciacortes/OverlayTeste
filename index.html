<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Overlay de Presentes Minecraft</title>
    <style>
      :root {
        --orange: #ff8200;
        --amber: #ffb34d;
        --panel: rgba(10, 13, 17, 0.91);
        --card-w: 178px;
        --card-h: 94px;
        --gap: 12px;
        --duration: 118s;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      body {
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0 2.1vw 4.1vh;
        pointer-events: none;
      }
      #widget {
        width: min(100%, 1870px);
        position: relative;
        pointer-events: auto;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0 0 9px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 2px 8px #000;
      }
      .heading:before,
      .heading:after {
        content: "";
        height: 1px;
        width: clamp(25px, 5vw, 90px);
        background: linear-gradient(90deg, transparent, var(--orange));
      }
      .heading:after {
        transform: scaleX(-1);
      }
      .spark {
        width: 6px;
        height: 6px;
        background: var(--orange);
        transform: rotate(45deg);
        box-shadow: 0 0 9px var(--orange);
      }
      .viewport {
        position: relative;
        overflow: hidden;
        padding: 7px 0 10px;
      }
      .viewport:before,
      .viewport:after {
        content: "";
        position: absolute;
        z-index: 4;
        top: 0;
        bottom: 0;
        width: clamp(18px, 3.5vw, 64px);
        pointer-events: none;
      }
      .viewport:before {
        left: 0;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.38), transparent);
      }
      .viewport:after {
        right: 0;
        background: linear-gradient(270deg, rgba(0, 0, 0, 0.38), transparent);
      }
      .track {
        display: flex;
        width: max-content;
        will-change: transform;
        animation: scroll var(--duration) linear infinite;
      }
      #widget:hover .track {
        animation-play-state: paused;
      }
      .group {
        display: flex;
        align-items: center;
        gap: var(--gap);
        padding-right: var(--gap);
        flex: none;
      }
      .pair {
        width: var(--card-w);
        height: var(--card-h);
        flex: none;
        position: relative;
        padding: 1.5px;
        background: linear-gradient(
          135deg,
          #ffc16a 0%,
          var(--orange) 43%,
          #bd5100 100%
        );
        clip-path: polygon(
          13px 0,
          calc(100% - 13px) 0,
          100% 13px,
          100% calc(100% - 13px),
          calc(100% - 13px) 100%,
          13px 100%,
          0 calc(100% - 13px),
          0 13px
        );
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.34))
          drop-shadow(0 0 5px rgba(255, 130, 0, 0.17));
        transition:
          filter 0.2s ease,
          transform 0.2s ease;
      }
      .pair:hover {
        transform: translateY(-2px);
        filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.48))
          drop-shadow(0 0 8px rgba(255, 130, 0, 0.4));
      }
      .inner {
        height: 100%;
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr);
        align-items: center;
        gap: 4px;
        padding: 8px 10px;
        position: relative;
        background:
          radial-gradient(
            ellipse at 0 0,
            rgba(255, 130, 0, 0.14),
            transparent 58%
          ),
          linear-gradient(120deg, rgba(20, 23, 27, 0.97), rgba(7, 9, 12, 0.94));
        clip-path: polygon(
          12px 0,
          calc(100% - 12px) 0,
          100% 12px,
          100% calc(100% - 12px),
          calc(100% - 12px) 100%,
          12px 100%,
          0 calc(100% - 12px),
          0 12px
        );
      }
      .inner:after {
        content: "";
        position: absolute;
        inset: 5px;
        border: 1px solid rgba(255, 179, 77, 0.14);
        pointer-events: none;
        clip-path: polygon(
          9px 0,
          calc(100% - 9px) 0,
          100% 9px,
          100% calc(100% - 9px),
          calc(100% - 9px) 100%,
          9px 100%,
          0 calc(100% - 9px),
          0 9px
        );
      }
      .visual {
        height: 70px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        position: relative;
        z-index: 1;
      }
      .visual img {
        display: block;
        width: 100%;
        height: 61px;
        object-fit: contain;
        object-position: center;
        max-width: 68px;
        max-height: 61px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      }
      .caption {
        font-size: 7px;
        font-weight: 900;
        letter-spacing: 1px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.62);
        text-transform: uppercase;
      }
      .arrow {
        display: grid;
        place-items: center;
        position: relative;
        z-index: 1;
        color: var(--amber);
        font-size: 15px;
        font-weight: 900;
        text-shadow: 0 0 9px rgba(255, 130, 0, 0.55);
      }
      .num {
        position: absolute;
        z-index: 2;
        top: 5px;
        left: 8px;
        color: #ffd29a;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 0.6px;
        text-shadow: 0 1px 4px #000;
      }
      @keyframes scroll {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(-50%, 0, 0);
        }
      }
      @media (max-width: 1100px) {
        :root {
          --card-w: 150px;
          --card-h: 82px;
          --gap: 9px;
        }
        .inner {
          grid-template-columns: minmax(0, 1fr) 14px minmax(0, 1fr);
          gap: 2px;
          padding: 6px 7px;
        }
        .visual {
          height: 62px;
        }
        .visual img {
          height: 52px;
          max-height: 52px;
          max-width: 56px;
        }
        .caption {
          font-size: 6px;
        }
      }
      @media (max-height: 650px) {
        #stage {
          padding-bottom: 16px;
        }
        .heading {
          margin-bottom: 4px;
          font-size: 8px;
        }
        :root {
          --card-h: 76px;
        }
        .visual {
          height: 56px;
        }
        .visual img {
          height: 47px;
          max-height: 47px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .track {
          animation: none;
        }
      }
    </style>
  </head>
  <body>

        <div class="heading">

            class="spark"
          ></span>
        </div>
        <div class="viewport" id="viewport">
          <div class="track" id="track"></div>
        </div>
      </section>
    </main>

      const source = (id) => "data:image/png;base64," + IMAGES[id];
      function makePair(item) {
        const card = document.createElement("article");
        card.className = "pair";
        card.setAttribute(
          "aria-label",
          "Presente " +
            String(item.index).padStart(2, "0") +
            " e sua ação correspondente",
        );
        const inner = document.createElement("div");
        inner.className = "inner";
        const number = document.createElement("span");
        number.className = "num";
        number.textContent = String(item.index).padStart(2, "0");
        const gift = document.createElement("div");
        gift.className = "visual";
        const giftImg = document.createElement("img");
        giftImg.src = source(item.gift);
        giftImg.alt = "Presente";
        giftImg.draggable = false;
        const giftCaption = document.createElement("span");
        giftCaption.className = "caption";
        giftCaption.textContent = "Presente";
        gift.append(giftImg, giftCaption);
        const arrow = document.createElement("div");
        arrow.className = "arrow";
        arrow.textContent = "›";
        const action = document.createElement("div");
        action.className = "visual";
        const actionImg = document.createElement("img");
        actionImg.src = source(item.action);
        actionImg.alt = "Ação Minecraft";
        actionImg.draggable = false;
        const actionCaption = document.createElement("span");
        actionCaption.className = "caption";
        actionCaption.textContent = "Ação";
        action.append(actionImg, actionCaption);
        inner.append(number, gift, arrow, action);
        card.append(inner);
        return card;
      }
      const track = document.getElementById("track");
      function makeGroup() {
        const group = document.createElement("div");
        group.className = "group";
        group.setAttribute("aria-hidden", "true");
        PAIRS.forEach((item) => group.append(makePair(item)));
        return group;
      }
      track.append(makeGroup(), makeGroup());
      // Mantém velocidade visual constante em diferentes resoluções.
      function tuneSpeed() {
        const group = track.firstElementChild;
        if (!group) return;
        const width = group.getBoundingClientRect().width;
        const pxPerSecond = 62;
        document.documentElement.style.setProperty(
          "--duration",
          Math.max(48, width / pxPerSecond) + "s",
        );
      }
      new ResizeObserver(tuneSpeed).observe(
        document.getElementById("viewport"),
      );
      window.addEventListener("load", tuneSpeed, { once: true });
      tuneSpeed();
    </script>
