<style>
:root{--orange:#ff8200;--gold:#ffd18a;--ticker:78s;--cardW:276px;--cardH:116px;--gap:14px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 2.2vw 5vh;pointer-events:none}
#overlay{width:min(100%,1850px);pointer-events:auto;position:relative}
.heading{display:flex;justify-content:center;align-items:center;gap:9px;margin-bottom:10px;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#f4f4f4;text-shadow:0 2px 8px #000}.heading i{width:6px;height:6px;background:var(--orange);transform:rotate(45deg);box-shadow:0 0 8px var(--orange)}.heading:before,.heading:after{content:"";width:55px;height:1px;background:linear-gradient(90deg,transparent,var(--orange))}.heading:after{transform:scaleX(-1)}
.viewport{overflow:hidden;position:relative;padding:8px 0 12px}.viewport:before,.viewport:after{content:"";position:absolute;z-index:4;top:0;bottom:0;width:42px;pointer-events:none}.viewport:before{left:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}.viewport:after{right:0;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.track{display:flex;width:max-content;will-change:transform;animation:scroll var(--ticker) linear infinite}.group{display:flex;gap:var(--gap);padding-right:var(--gap);flex:none}#overlay:hover .track{animation-play-state:paused}
.card{width:var(--cardW);height:var(--cardH);flex:none;padding:1.6px;background:linear-gradient(135deg,#ffc15c,#ff8200 48%,#b84c00);clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px);filter:drop-shadow(0 4px 10px rgba(0,0,0,.4)) drop-shadow(0 0 5px rgba(255,130,0,.16));transition:filter .2s,transform .2s}
.card:hover{transform:translateY(-2px);filter:drop-shadow(0 5px 12px rgba(0,0,0,.45)) drop-shadow(0 0 9px rgba(255,130,0,.35))}
.inner{height:100%;display:grid;grid-template-columns:74px minmax(0,1fr) 74px;align-items:center;gap:9px;padding:8px 11px;background:radial-gradient(ellipse at 0 0,rgba(255,130,0,.12),transparent 55%),linear-gradient(120deg,rgba(18,20,23,.97),rgba(7,9,12,.96));clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 15px,100% calc(100% - 15px),calc(100% - 15px) 100%,15px 100%,0 calc(100% - 15px),0 15px);position:relative}
.inner:after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,190,100,.14);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);pointer-events:none}
.gift-side,.action-side{width:74px;height:90px;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;overflow:visible}
.gift-img,.action-img{display:block;width:auto;height:auto;max-width:72px;max-height:86px;object-fit:contain;object-position:center;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.62))}
.info{min-width:0;text-align:center;z-index:1}.eyebrow{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#ffb35b;font-weight:900;margin-bottom:5px}.name{font-size:14px;line-height:1.12;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 6px #000}.action-name{font-size:9px;color:#c0c5cc;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price-row{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:7px}.price{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid rgba(255,130,0,.55);border-radius:30px;background:rgba(255,130,0,.13);font-size:10px;font-weight:900;color:var(--gold)}.coin{width:11px;height:11px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe8a4,#ff9400);color:#6b3300;font-size:8px}.mult{font-size:8px;color:#ffd08a;padding:3px 5px;border-radius:5px;background:rgba(255,130,0,.12);border:1px solid rgba(255,130,0,.4)}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:1050px){:root{--cardW:236px;--cardH:102px;--gap:10px}.inner{grid-template-columns:60px minmax(0,1fr) 60px;gap:5px;padding:7px}.gift-side,.action-side{width:60px;height:78px}.gift-img,.action-img{max-width:59px;max-height:74px}.name{font-size:12px}.action-name{font-size:8px}.price{font-size:9px}}
@media(max-height:650px){#stage{padding-bottom:18px}.heading{margin-bottom:5px}.card{height:92px}.gift-side,.action-side{height:70px}.gift-img,.action-img{max-height:68px}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}

function makeCard(item){const card=document.createElement('article');card.className='card';card.setAttribute('aria-label',item.name+' — '+item.price);
 const inner=document.createElement('div');inner.className='inner';
 // Presente sempre à ESQUERDA.
 const giftSide=document.createElement('div');giftSide.className='gift-side';const gift=document.createElement('img');gift.className='gift-img';gift.src=src(item.gift+'_gift');gift.alt='Presente '+item.name;gift.draggable=false;giftSide.append(gift);
 const info=document.createElement('div');info.className='info';const eyebrow=document.createElement('div');eyebrow.className='eyebrow';eyebrow.textContent='Presente';const name=document.createElement('div');name.className='name';name.textContent=item.name;const action=document.createElement('div');action.className='action-name';action.textContent=item.action;action.title=item.action;const row=document.createElement('div');row.className='price-row';const price=document.createElement('span');price.className='price';const coin=document.createElement('span');coin.className='coin';coin.textContent='$';const amount=document.createElement('span');amount.textContent=Number(item.price).toLocaleString('pt-BR');price.append(coin,amount);row.append(price);if(item.mult){const mult=document.createElement('span');mult.className='mult';mult.textContent=item.mult;row.append(mult)}info.append(eyebrow,name,action,row);
 // Ação / mob sempre à DIREITA.
 const actionSide=document.createElement('div');actionSide.className='action-side';const mob=document.createElement('img');mob.className='action-img';mob.src=src(item.mob+'_mob');mob.alt='Ação '+item.name;mob.draggable=false;actionSide.append(mob);
 inner.append(giftSide,info,actionSide);card.append(inner);return card}
const track=document.getElementById('track');function group(){const g=document.createElement('div');g.className='group';g.setAttribute('aria-hidden','true');ITEMS.forEach(i=>g.append(makeCard(i)));return g}track.append(group(),group());
// Metade da faixa é exatamente um conjunto de presentes; duração pela largura real.
function speed(){const first=track.firstElementChild;if(!first)return;const seconds=Math.max(42,first.getBoundingClientRect().width/34);document.documentElement.style.setProperty('--ticker',seconds+'s')}
new ResizeObserver(speed).observe(document.querySelector('.viewport'));window.addEventListener('load',speed,{once:true});speed();
</script></body></html>
